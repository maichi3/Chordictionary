<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chordictionary</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Chordictionary</h1>
    <p>コードを「聴いて・弾いて・知る」</p>
</header>

<main>

    <!-- 音声ファイル -->
    <section class="card">
        <h2>🎵 音声解析</h2>

        <input
            type="file"
            id="audio-file"
            accept="audio/*"
        >

        <p id="audio-status">
            音声ファイルを選択してください。
        </p>
    </section>

    <section class="card">
    <h2>🎼 キー</h2>

    <select id="key-select">
        <option value="C-major">C Major</option>
        <option value="G-major">G Major</option>
        <option value="D-major">D Major</option>
        <option value="A-major">A Major</option>
        <option value="E-major">E Major</option>
        <option value="B-major">B Major</option>
        <option value="F-major">F Major</option>
        <option value="A-minor">A minor</option>
        <option value="E-minor">E minor</option>
        <option value="B-minor">B minor</option>
        <option value="D-minor">D minor</option>
        <option value="G-minor">G minor</option>
        <option value="C-minor">C minor</option>
    </select>
</section>

    <!-- コード表示 -->
    <section class="card">
        <h2>判定されたコード</h2>

        <div id="chord-name">---</div>

        <div id="notes">
            構成音：---
        </div>
    </section>


    <!-- キーボード -->
    <section class="card">
        <h2>🎹 Keyboard</h2>

        <div id="keyboard"></div>
    </section>


    <!-- ギター -->
    <section class="card">
        <h2>🎸 Guitar</h2>

        <div id="guitar"></div>
    </section>


    <!-- コード情報 -->
    <section class="card">
        <h2>📖 コード情報</h2>

        <div id="chord-info">

            <p>
                <strong>役割：</strong>
                <span id="function">---</span>
            </p>

            <p>
                <strong>次に来やすいコード：</strong>
                <span id="next-chords">---</span>
            </p>

            <p>
                <strong>雰囲気：</strong>
                <span id="mood">---</span>
            </p>

        </div>
    </section>

</main>

<script src="js/chordDetector.js"></script>
<script src="js/chordDatabase.js"></script>
<script src="js/keyboard.js"></script>

</body>
</html>
