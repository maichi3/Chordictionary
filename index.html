
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chordictionary</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Chordictionary</h1>
    <p>コードを「聴いて・弾いて・知る」</p>
</header>

<main>

    <!-- 音声ファイル -->
    <section class="card">
        <h2>🎵 音声解析</h2>

        <input
            type="file"
            id="audio-file"
            accept=".mp3,audio/mpeg"
        >

        <p id="audio-status">
            音声ファイルを選択してください。
        </p>
        <div id="audio-results" aria-live="polite"></div>
    </section>

    <!-- キー -->
    <section class="card">
        <h2>🎼 キー</h2>

        <label for="key-select">キー：</label>
        <select id="key-select">
            <option value="C-major">C</option>
            <option value="C#-major">C♯</option>
            <option value="D-major">D</option>
            <option value="D#-major">D♯</option>
            <option value="E-major">E</option>
            <option value="F-major">F</option>
            <option value="F#-major">F♯</option>
            <option value="G-major">G</option>
            <option value="G#-major">G♯</option>
            <option value="A-major">A</option>
            <option value="A#-major">A♯</option>
            <option value="B-major">B</option>
        </select>
    </section>

    <!-- コード表示 -->
    <section class="card">
        <h2>判定されたコード</h2>

        <div id="chord-name">---</div>

        <div id="notes">
            構成音：---
        </div>
    </section>

    <!-- 説明カードと楽器カード -->
    <div class="feature-layout">

        <!-- 左側：説明カード -->
        <section class="card feature-description">
            <h2>🎹🎸 音の入力方法</h2>

            <p>
                鍵盤やギターで音を選択して、
                コードを調べることができます。
            </p>

            <p>
                複数の楽器で選択した音を組み合わせて、
                コードを判定できます。
            </p>

            <p>
                選択した音は、楽器を切り替えても
                保存されます。
            </p>

            <p>
                選択した音をもう一度クリックすると、
                解除できます。
            </p>
        </section>

        <!-- 右側：楽器カード -->
        <section class="card feature-controls">

            <h2>楽器を選択</h2>

            <!-- 楽器切り替えボタン -->
            <div class="instrument-tabs">
                <button
                    type="button"
                    id="keyboard-tab"
                    class="instrument-tab active"
                    data-instrument="keyboard"
                    aria-pressed="true"
                >
                    🎹 Keyboard
                </button>

                <button
                    type="button"
                    id="guitar-tab"
                    class="instrument-tab"
                    data-instrument="guitar"
                    aria-pressed="false"
                >
                    🎸 Guitar
                </button>
            </div>

            <!-- 鍵盤 -->
            <div
                id="keyboard-panel"
                class="instrument-panel"
            >
                <h2>🎹 Keyboard</h2>
                <div id="keyboard"></div>
            </div>

            <!-- ギター -->
            <div
                id="guitar-panel"
                class="instrument-panel"
                hidden
            >
                <h2>🎸 Guitar</h2>
                <div id="guitar"></div>
            </div>

            <!-- リセット -->
            <button id="reset-button" type="button">
                選択をリセット
            </button>

        </section>

    </div>

    <!-- コード情報 -->
    <section class="card">
        <h2>📖 コード情報</h2>

        <div id="chord-info">

            <p>
                <strong>役割：</strong>
                <span id="function">---</span>
            </p>

            <p>
                <strong>次に来やすいコード：</strong>
                <span id="next-chords">---</span>
            </p>

            <p>
                <strong>雰囲気：</strong>
                <span id="mood">---</span>
            </p>

        </div>
    </section>

</main>

<script src="js/chordDetector.js"></script>
<script src="js/chordDatabase.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/audioAnalyzer.js"></script>

</body>
</html>
